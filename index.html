<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roblox AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #15151f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #createButton {
      background: #6c4cff;
      color: white;
    }

    #createButton:disabled {
      opacity: 0.6;
    }

    .download-button {
      background: #16a34a;
      color: white;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
    }

    .game-card {
      background: #15151f;
      border: 1px solid #29293a;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
    }

    .info {
      background: #0f0f18;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .script-card {
      margin-top: 20px;
      background: #08080d;
      border-radius: 10px;
      padding: 15px;
    }

    .location {
      color: #8f8fff;
      margin-bottom: 10px;
    }

    pre {
      white-space: pre-wrap;
      overflow-x: auto;
      background: #050509;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .loading {
      display: flex;
      justify-content: center;
      gap: 6px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .2s;
    }

    .dot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%, 100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 Roblox AI Studio</h1>

    <div class="subtitle">
      Crie projetos Roblox usando inteligência artificial
    </div>

    <textarea
      id="gameIdea"
      placeholder="Digite a ideia do seu jogo..."
    ></textarea>

    <button id="createButton">
      🚀 CRIAR MEU JOGO
    </button>

    <div id="status"></div>

    <div id="result"></div>

  </div>

  <script>

    const API_URL = "/api/criar-jogo";

    const button =
      document.getElementById("createButton");

    const idea =
      document.getElementById("gameIdea");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");

    let projetoAtual = null;


    button.addEventListener("click", async () => {

      const ideia = idea.value.trim();

      if (!ideia) {
        status.textContent =
          "❌ Digite uma ideia primeiro.";
        return;
      }

      button.disabled = true;
      button.textContent = "⏳ CRIANDO...";

      status.innerHTML = `
        <div class="loading">
          🤖 A IA está criando
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      `;

      result.innerHTML = "";

      try {

        const resposta = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            ideia: ideia
          })
        });


        const texto =
          await resposta.text();


        let dados;

        try {
          dados = JSON.parse(texto);
        } catch {
          throw new Error(
            texto ||
            "Resposta inválida do servidor."
          );
        }


        if (!resposta.ok) {

          throw new Error(
            dados.details ||
            dados.error ||
            "Erro no servidor."
          );

        }


        projetoAtual = dados;

        status.textContent =
          "✅ Seu jogo foi criado!";


        let html = `

          <div class="game-card">

            <h2>
              🎮 ${
                escapeHtml(
                  dados.game_name ||
                  "Meu Jogo Roblox"
                )
              }
            </h2>

            <p>
              ${
                escapeHtml(
                  dados.description ||
                  "Projeto criado pela IA."
                )
              }
            </p>

            <button
              id="downloadButton"
              class="download-button"
            >
              📥 BAIXAR PROJETO ROBLOX
            </button>

        `;


        if (dados.map) {

          html += `

            <div class="info">

              🗺️ <strong>Mapa</strong>

              <br><br>

              ${
                escapeHtml(
                  typeof dados.map === "string"
                    ? dados.map
                    : dados.map.description || ""
                )
              }

            </div>

          `;

        }


        if (Array.isArray(dados.systems)) {

          html += `

            <div class="info">

              ⚙️ <strong>Sistemas</strong>

              <br><br>

              ${
                dados.systems
                  .map(s =>
                    escapeHtml(
                      typeof s === "string"
                        ? s
                        : s.name || ""
                    )
                  )
                  .join("<br>")
              }

            </div>

          `;

        }


        if (Array.isArray(dados.scripts)) {

          dados.scripts.forEach(script => {

            html += `

              <div class="script-card">

                <h3>
                  📜 ${
                    escapeHtml(
                      script.name ||
                      "Script"
                    )
                  }
                </h3>

                <div class="location">

                  📁 Local:
                  ${
                    escapeHtml(
                      script.location ||
                      "ServerScriptService"
                    )
                  }

                </div>

                <pre>${
                  escapeHtml(
                    script.code || ""
                  )
                }</pre>

              </div>

            `;

          });

        }


        html += `
          </div>
        `;


        result.innerHTML = html;


        document
          .getElementById("downloadButton")
          .addEventListener(
            "click",
            baixarProjeto
          );


      } catch (erro) {

        console.error(erro);

        status.textContent =
          "❌ " + erro.message;

      } finally {

        button.disabled = false;

        button.textContent =
          "🚀 CRIAR MEU JOGO";

      }

    });


    function baixarProjeto() {

      if (!projetoAtual) {

        alert(
          "Crie um projeto primeiro."
        );

        return;

      }


      const rbxlx =
        criarArquivoRoblox(
          projetoAtual
        );


      const blob =
        new Blob(
          [rbxlx],
          {
            type:
              "application/xml"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");


      link.href = url;

      link.download =
        nomeArquivo(
          projetoAtual.game_name ||
          "MeuJogo"
        ) + ".rbxlx";


      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);

    }


    function criarArquivoRoblox(projeto) {

      let scripts = "";


      if (
        Array.isArray(
          projeto.scripts
        )
      ) {

        projeto.scripts.forEach(
          script => {

            const nome =
              escapeXml(
                script.name ||
                "Script"
              );


            const codigo =
              escapeXml(
                script.code ||
                ""
              );


            scripts += `

              <Item
                class="Script"
                referent="RBX_SCRIPT_${Math.random()
                  .toString(36)
                  .substring(2)}"
              >

                <Properties>

                  <string
                    name="Name"
                  >
                    ${nome}
                  </string>

                  <ProtectedString
                    name="Source"
                  >
                    ${codigo}
                  </ProtectedString>

                </Properties>

              </Item>

            `;

          }
        );

      }


      return `<?xml version="1.0" encoding="utf-8"?>

<roblox
  version="4"
  studio_place_id="0"
  xmlns:xmime="http://www.w3.org/2001/XMLSchema-instance"
  xmime:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd"
>

  <External>null</External>

  <External>nil</External>


  <Item
    class="Workspace"
    referent="RBX_WORKSPACE"
  >

    <Properties>

      <string name="Name">
        Workspace
      </string>

    </Properties>

  </Item>


  <Item
    class="ServerScriptService"
    referent="RBX_SERVER_SCRIPT_SERVICE"
  >

    <Properties>

      <string name="Name">
        ServerScriptService
      </string>

    </Properties>

    ${scripts}

  </Item>


  <Item
    class="ReplicatedStorage"
    referent="RBX_REPLICATED_STORAGE"
  >

    <Properties>

      <string name="Name">
        ReplicatedStorage
      </string>

    </Properties>

  </Item>


  <Item
    class="StarterGui"
    referent="RBX_STARTER_GUI"
  >

    <Properties>

      <string name="Name">
        StarterGui
      </string>

    </Properties>

  </Item>


  <Item
    class="StarterPlayer"
    referent="RBX_STARTER_PLAYER"
  >

    <Properties>

      <string name="Name">
        StarterPlayer
      </string>

    </Properties>

  </Item>


</roblox>`;

    }


    function escapeXml(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&apos;"
        );

    }


    function escapeHtml(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function nomeArquivo(nome) {

      return String(nome)

        .replace(
          /[<>:"/\\|?*]/g,
          ""
        )

        .replace(
          /\s+/g,
          "_"
        )

        .slice(
          0,
          80
        );

    }

  </script>

</body>
</html>
