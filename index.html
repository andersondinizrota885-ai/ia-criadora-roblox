<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Roblox AI Studio</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      background: #08080d;
      color: white;

      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 160px;

      padding: 15px;

      border-radius: 12px;
      border: 1px solid #30303d;

      background: #15151e;
      color: white;

      font-size: 16px;

      outline: none;
    }

    button {
      width: 100%;

      padding: 16px;
      margin-top: 15px;

      border: none;
      border-radius: 12px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #createButton {
      background: #6c4cff;
      color: white;
    }

    #createButton:disabled {
      opacity: 0.5;
    }

    .download-button {
      background: #16a34a;
      color: white;
    }

    .download-builder {
      background: #2563eb;
      color: white;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
    }

    .game-card {
      background: #15151e;

      border: 1px solid #292936;

      border-radius: 15px;

      padding: 20px;

      margin-top: 20px;
    }

    .info {
      background: #0d0d14;

      padding: 15px;

      margin-top: 15px;

      border-radius: 10px;
    }

    .area {
      background: #11111a;

      padding: 12px;

      margin-top: 8px;

      border-radius: 8px;
    }

    .object-card {
      background: #0d0d14;

      padding: 12px;

      margin-top: 8px;

      border-radius: 8px;
    }

    .npc-card {
      background: #0d0d14;

      padding: 12px;

      margin-top: 8px;

      border-radius: 8px;
    }

    .system-card {
      background: #0d0d14;

      padding: 12px;

      margin-top: 8px;

      border-radius: 8px;
    }

    .script-card {
      background: #07070b;

      padding: 15px;

      margin-top: 20px;

      border-radius: 10px;
    }

    .location {
      color: #9b8cff;

      margin-bottom: 10px;
    }

    pre {
      white-space: pre-wrap;

      overflow-x: auto;

      background: #030305;

      padding: 12px;

      border-radius: 8px;

      font-size: 12px;
    }

    .loading {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;

      background: white;

      border-radius: 50%;

      animation: blink 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .2s;
    }

    .dot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>
      🤖 Roblox AI Studio
    </h1>

    <div class="subtitle">
      Crie mapas, NPCs, sistemas e scripts com IA
    </div>

    <textarea
      id="gameIdea"
      placeholder="Exemplo: Crie um jogo de sobrevivência em uma ilha com monstros, casas, floresta, sistema de moedas e loja."
    ></textarea>

    <button id="createButton">
      🚀 CRIAR MEU JOGO
    </button>

    <div id="status"></div>

    <div id="result"></div>

  </div>


<script>

const API_URL =
  "/api/criar-jogo";


const button =
  document.getElementById(
    "createButton"
  );


const idea =
  document.getElementById(
    "gameIdea"
  );


const status =
  document.getElementById(
    "status"
  );


const result =
  document.getElementById(
    "result"
  );


let projetoAtual = null;


/* =========================
   CRIAR JOGO
========================= */

button.addEventListener(
  "click",
  async () => {

    const ideia =
      idea.value.trim();


    if (!ideia) {

      status.textContent =
        "❌ Digite uma ideia primeiro.";

      return;
    }


    button.disabled = true;

    button.textContent =
      "⏳ CRIANDO...";


    status.innerHTML = `

      <div class="loading">

        🤖 A IA está criando

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

    `;


    result.innerHTML = "";


    try {

      const resposta =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              ideia: ideia
            })
          }
        );


      const texto =
        await resposta.text();


      let dados;


      try {

        dados =
          JSON.parse(texto);

      } catch {

        throw new Error(
          texto ||
          "Resposta inválida do servidor."
        );

      }


      if (!resposta.ok) {

        throw new Error(
          dados.details ||
          dados.error ||
          "Erro no servidor."
        );

      }


      projetoAtual =
        dados;


      status.textContent =
        "✅ Jogo criado com sucesso!";


      mostrarProjeto(
        dados
      );


    } catch (erro) {

      console.error(
        erro
      );

      status.textContent =
        "❌ " +
        erro.message;


    } finally {

      button.disabled =
        false;

      button.textContent =
        "🚀 CRIAR MEU JOGO";

    }

  }
);


/* =========================
   MOSTRAR PROJETO
========================= */

function mostrarProjeto(
  dados
) {

  let html = `

    <div class="game-card">

      <h2>
        🎮
        ${escapeHtml(
          dados.game_name ||
          "Meu Jogo Roblox"
        )}
      </h2>

      <p>
        ${escapeHtml(
          dados.description ||
          "Projeto criado pela IA."
        )}
      </p>

      <p>
        <strong>🎯 Objetivo:</strong><br>
        ${escapeHtml(
          dados.objective ||
          ""
        )}
      </p>

      <p>
        <strong>🎮 Gênero:</strong>
        ${escapeHtml(
          dados.genre ||
          ""
        )}
      </p>


      <button
        id="downloadButton"
        class="download-button"
      >
        📥 BAIXAR PROJETO .RBXLX
      </button>


      <button
        id="builderButton"
        class="download-builder"
      >
        🛠️ BAIXAR BUILDER .LUA
      </button>

  `;


  /* MAPA */

  if (dados.map) {

    html += `

      <div class="info">

        🗺️
        <strong>MAPA</strong>

        <br><br>

        ${escapeHtml(
          dados.map.description ||
          ""
        )}

    `;


    if (
      Array.isArray(
        dados.map.areas
      )
    ) {

      dados.map.areas.forEach(
        area => {

          html += `

            <div class="area">

              <strong>
                📍
                ${escapeHtml(
                  area.name ||
                  "Área"
                )}
              </strong>

              <br>

              ${escapeHtml(
                area.description ||
                ""
              )}

            </div>

          `;

        }
      );

    }


    html += `
      </div>
    `;

  }


  /* OBJETOS */

  if (
    Array.isArray(
      dados.objects
    )
  ) {

    html += `

      <div class="info">

        🧱
        <strong>OBJETOS DO MAPA</strong>

    `;


    dados.objects.forEach(
      objeto => {

        html += `

          <div class="object-card">

            <strong>
              ${escapeHtml(
                objeto.name ||
                "Objeto"
              )}
            </strong>

            <br>

            Tipo:
            ${escapeHtml(
              objeto.type ||
              "Part"
            )}

            <br>

            ${escapeHtml(
              objeto.description ||
              ""
            )}

          </div>

        `;

      }
    );


    html += `
      </div>
    `;

  }


  /* NPCS */

  if (
    Array.isArray(
      dados.npcs
    )
  ) {

    html += `

      <div class="info">

        👾
        <strong>NPCS</strong>

    `;


    dados.npcs.forEach(
      npc => {

        html += `

          <div class="npc-card">

            <strong>
              ${escapeHtml(
                npc.name ||
                "NPC"
              )}
            </strong>

            <br>

            ❤️ Vida:
            ${escapeHtml(
              npc.health ||
              100
            )}

            <br>

            ⚔️ Dano:
            ${escapeHtml(
              npc.damage ||
              10
            )}

            <br>

            ${escapeHtml(
              npc.description ||
              ""
            )}

          </div>

        `;

      }
    );


    html += `
      </div>
    `;

  }


  /* SISTEMAS */

  if (
    Array.isArray(
      dados.systems
    )
  ) {

    html += `

      <div class="info">

        ⚙️
        <strong>SISTEMAS</strong>

    `;


    dados.systems.forEach(
      sistema => {

        html += `

          <div class="system-card">

            <strong>
              ${escapeHtml(
                sistema.name ||
                "Sistema"
              )}
            </strong>

            <br>

            ${escapeHtml(
              sistema.description ||
              ""
            )}

          </div>

        `;

      }
    );


    html += `
      </div>
    `;

  }


  /* SCRIPTS */

  if (
    Array.isArray(
      dados.scripts
    )
  ) {

    dados.scripts.forEach(
      script => {

        html += `

          <div class="script-card">

            <h3>

              📜
              ${escapeHtml(
                script.name ||
                "Script"
              )}

            </h3>

            <div class="location">

              📁 Local:

              ${escapeHtml(
                script.location ||
                "ServerScriptService"
              )}

            </div>

            <p>

              ${escapeHtml(
                script.description ||
                ""
              )}

            </p>

            <pre>${escapeHtml(
              script.code ||
              ""
            )}</pre>

          </div>

        `;

      }
    );

  }


  /* FINAL */

  html += `

      <div class="info">

        💡
        <strong>
          PROJETO GERADO
        </strong>

        <br><br>

        O Builder contém o código
        responsável por montar a
        estrutura inicial do mapa
        dentro do Roblox Studio.

      </div>

    </div>

  `;


  result.innerHTML =
    html;


  document
    .getElementById(
      "downloadButton"
    )
    .addEventListener(
      "click",
      baixarProjeto
    );


  document
    .getElementById(
      "builderButton"
    )
    .addEventListener(
      "click",
      baixarBuilder
    );

}


/* =========================
   BAIXAR RBXLX
========================= */

function baixarProjeto() {

  if (!projetoAtual) {

    alert(
      "Crie um projeto primeiro."
    );

    return;
  }


  const arquivo =
    criarRBXLX(
      projetoAtual
    );


  const blob =
    new Blob(
      [arquivo],
      {
        type:
          "application/xml"
      }
    );


  baixarBlob(
    blob,
    nomeArquivo(
      projetoAtual.game_name ||
      "MeuJogo"
    ) + ".rbxlx"
  );

}


/* =========================
   BAIXAR BUILDER
========================= */

function baixarBuilder() {

  if (!projetoAtual) {

    alert(
      "Crie um projeto primeiro."
    );

    return;
  }


  const builder =
    projetoAtual
      .builder_script
      ?.code;


  if (!builder) {

    alert(
      "A IA não gerou um Builder."
    );

    return;
  }


  const blob =
    new Blob(
      [builder],
      {
        type:
          "text/plain"
      }
    );


  baixarBlob(
    blob,
    "MapBuilder.lua"
  );

}


/* =========================
   CRIAR RBXLX
========================= */

function criarRBXLX(
  projeto
) {

  let scripts = "";


  /* BUILDER */

  if (
    projeto
      .builder_script
      ?.code
  ) {

    scripts += criarScriptXML(
      projeto
        .builder_script
        .name ||
        "MapBuilder",

      projeto
        .builder_script
        .code,

      "RBX_BUILDER"
    );

  }


  /* SCRIPTS NORMAIS */

  if (
    Array.isArray(
      projeto.scripts
    )
  ) {

    projeto.scripts.forEach(
      (script, index) => {

        if (
          script.code
        ) {

          scripts +=
            criarScriptXML(
              script.name ||
              "Script_" +
              index,

              script.code,

              "RBX_SCRIPT_" +
              index
            );

        }

      }
    );

  }


  return `<?xml version="1.0" encoding="utf-8"?>

<roblox
  version="4"
  studio_place_id="0"
>

  <External>null</External>

  <External>nil</External>


  <Item
    class="Workspace"
    referent="RBX_WORKSPACE"
  >

    <Properties>

      <string name="Name">
        Workspace
      </string>

    </Properties>

  </Item>


  <Item
    class="ServerScriptService"
    referent="RBX_SERVER_SCRIPT_SERVICE"
  >

    <Properties>

      <string name="Name">
        ServerScriptService
      </string>

    </Properties>

    ${scripts}

  </Item>


  <Item
    class="ReplicatedStorage"
    referent="RBX_REPLICATED_STORAGE"
  >

    <Properties>

      <string name="Name">
        ReplicatedStorage
      </string>

    </Properties>

  </Item>


  <Item
    class="StarterGui"
    referent="RBX_STARTER_GUI"
  >

    <Properties>

      <string name="Name">
        StarterGui
      </string>

    </Properties>

  </Item>


  <Item
    class="StarterPlayer"
    referent="RBX_STARTER_PLAYER"
  >

    <Properties>

      <string name="Name">
        StarterPlayer
      </string>

    </Properties>

  </Item>


</roblox>`;

}


/* =========================
   SCRIPT XML
========================= */

function criarScriptXML(
  nome,
  codigo,
  referent
) {

  return `

    <Item
      class="Script"
      referent="${escapeXml(
        referent
      )}"
    >

      <Properties>

        <string name="Name">
          ${escapeXml(nome)}
        </string>

        <ProtectedString name="Source">
          ${escapeXml(codigo)}
        </ProtectedString>

      </Properties>

    </Item>

  `;

}


/* =========================
   DOWNLOAD
========================= */

function baixarBlob(
  blob,
  nome
) {

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    nome;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );

}


/* =========================
   ESCAPES
========================= */

function escapeXml(
  text
) {

  return String(
    text
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&apos;"
    );

}


function escapeHtml(
  text
) {

  return String(
    text
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function nomeArquivo(
  nome
) {

  return String(
    nome
  )

    .replace(
      /[<>:"/\\|?*]/g,
      ""
    )

    .replace(
      /\s+/g,
      "_"
    )

    .slice(
      0,
      80
    );

}

</script>

</body>

</html>
