<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Criadora Roblox</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #aaa;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #151520;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #6c4cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #aaa;
    }

    .result {
      display: none;
      margin-top: 25px;
      background: #151520;
      padding: 20px;
      border-radius: 15px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #08080d;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🤖 IA Criadora Roblox</h1>

  <p>Descreva seu jogo e a IA vai criar os scripts.</p>

  <textarea
    id="gameIdea"
    placeholder="Ex: Um jogo de parkour com moedas, fases e uma loja..."
  ></textarea>

  <button id="createButton">
    🚀 Criar Jogo
  </button>

  <div id="status"></div>

  <div class="result" id="result">
    <h2 id="gameName"></h2>
    <p id="description"></p>

    <h3>Scripts:</h3>
    <div id="scripts"></div>
  </div>

</div>

<script>
  const API_URL = "/api/criar-jogo";

  const gameIdea = document.getElementById("gameIdea");
  const createButton = document.getElementById("createButton");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const gameName = document.getElementById("gameName");
  const description = document.getElementById("description");
  const scripts = document.getElementById("scripts");

  createButton.addEventListener("click", async () => {

    const ideia = gameIdea.value.trim();

    if (!ideia) {
      status.textContent = "Digite uma ideia para o jogo.";
      return;
    }

    createButton.disabled = true;
    status.textContent = "🤖 Criando seu jogo...";
    result.style.display = "none";

    try {

      const resposta = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ideia: ideia
        })
      });

      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error(dados.details || dados.error || "Erro no servidor.");
      }

      gameName.textContent = dados.game_name || "Meu Jogo Roblox";
      description.textContent = dados.description || "";

      scripts.innerHTML = "";

      if (Array.isArray(dados.scripts)) {

        dados.scripts.forEach((script) => {

          const div = document.createElement("div");

          div.innerHTML = `
            <h4>${script.name || "Script"}</h4>
            <p>Local: ${script.location || "Roblox Studio"}</p>
            <pre>${escapeHtml(script.code || "")}</pre>
          `;

          scripts.appendChild(div);
        });

      }

      result.style.display = "block";
      status.textContent = "✅ Jogo criado!";

    } catch (erro) {

      console.error(erro);

      status.textContent =
        "❌ Erro: " + erro.message;

    } finally {

      createButton.disabled = false;

    }
  });

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>

</body>
</html>
